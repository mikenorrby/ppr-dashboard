function getStoredPin(email) {
  try {
    var pins = JSON.parse(localStorage.getItem("npins") || "{}");
    return pins[email] || null;
  } catch(e) { return null; }
}

function tryLogin() {
  var email = document.getElementById("em").value.trim().toLowerCase();
  var pin   = document.getElementById("pn").value.trim();
  var msg   = document.getElementById("msg");
  msg.textContent = "";

  if (!email) { msg.textContent = "Enter your email address."; return; }
  if (!pin || pin.length < 4) { msg.textContent = "Enter your 4-digit PIN."; return; }

  // Admin login
  if (ADMINS[email] !== undefined) {
    if (ADMINS[email] !== pin) { msg.textContent = "Incorrect PIN."; return; }
    showSchedule(email, "Admin", true);
    return;
  }

  // Employee login
  if (USERS[email] !== undefined) {
    var stored = getStoredPin(email);
    var correct = stored || "1234";
    if (pin === "1234" && !stored) {
      // First time — go to change PIN
      window._pendingUser = email;
      showChangePinPrompt();
      return;
    }
    if (pin !== correct) { msg.textContent = "Incorrect PIN. First time? Use: 1234"; return; }
    showSchedule(email, USERS[email], false);
    return;
  }

  msg.textContent = "Email not found. Contact your manager.";
}

function showChangePinPrompt() {
  var np = prompt("Welcome! Please set a new 4-digit PIN (cannot be 1234):");
  if (!np || np.length !== 4 || !/^[0-9]{4}$/.test(np) || np === "1234") {
    alert("Invalid PIN. Please use exactly 4 digits, not 1234.");
    return;
  }
  var cp = prompt("Confirm your new PIN:");
  if (np !== cp) { alert("PINs did not match. Try again."); return; }
  var pins = JSON.parse(localStorage.getItem("npins") || "{}");
  pins[window._pendingUser] = np;
  localStorage.setItem("npins", JSON.stringify(pins));
  showSchedule(window._pendingUser, USERS[window._pendingUser], false);
}

function buildTabs() {
  var today = new Date().toISOString().split("T")[0];
  var auto = 0, html = "";
  currentScheds.forEach(function(s, i) {
    var ws = new Date(s.week_start + "T12:00:00"), we = new Date(ws);
    we.setDate(we.getDate() + 6);
    var weStr = we.toISOString().split("T")[0];
    var lbl = (ws.getMonth()+1)+"/"+ws.getDate()+" - "+(we.getMonth()+1)+"/"+we.getDate()+"/"+String(we.getFullYear()).slice(2);
    var b = "";
    if (today >= s.week_start && today <= weStr) { b = "<span style='background:#375623;color:#fff;font-size:0.6rem;padding:1px 5px;border-radius:3px;margin-left:4px;'>CURRENT</span>"; auto = i; }
    else if (i > 0 && today > currentScheds[i-1].week_start) { b = "<span style='background:#9C5700;color:#fff;font-size:0.6rem;padding:1px 5px;border-radius:3px;margin-left:4px;'>NEXT</span>"; }
    html += "<button onclick='render(" + i + ")' id='tb" + i + "' style='background:#dce6f1;color:#1F3864;border:none;cursor:pointer;padding:7px 18px;font-size:0.82rem;font-weight:700;border-radius:4px 4px 0 0;font-family:inherit;'>" + lbl + b + "</button>";
  });
  document.getElementById("tabs").innerHTML = html;
  render(auto);
}

function render(idx) {
  var s = currentScheds[idx];
  if (!s) return;
  for (var i = 0; i < currentScheds.length; i++) {
    var t = document.getElementById("tb" + i);
    if (t) t.style.background = (i === idx) ? "#fff" : "#dce6f1";
  }
  var today = new Date().toISOString().split("T")[0];
  var secs = {}, ord = [];
  s.employees.forEach(function(e) {
    var k = e.section || "General";
    if (!secs[k]) { secs[k] = []; ord.push(k); }
    secs[k].push(e);
  });
  var h = "<table style='border-collapse:collapse;width:100%;min-width:700px;background:#fff;border:1px solid #999;font-size:12px;font-family:inherit;'><thead>";
  h += "<tr><th style='background:#fff;text-align:left;min-width:170px;padding:5px 8px;border:1px solid #bbb;'>Employee</th>";
  s.days.forEach(function(d) {
    var it = d.date === today;
    h += "<th style='background:" + (it?"#FFEB9C":"#FFFF99") + ";color:" + (it?"#9C5700":"#000") + ";font-weight:700;text-align:center;padding:5px 8px;border:1px solid #bbb;'>" + d.day + "</th>";
  });
  h += "</tr><tr><td style='background:#fff;padding:3px 8px;border:1px solid #bbb;'></td>";
  s.days.forEach(function(d) {
    var it = d.date === today;
    var lbl = d.date ? (function(){ var dt = new Date(d.date+"T12:00:00"); return (dt.getMonth()+1)+"/"+dt.getDate(); })() : "";
    h += "<td style='background:" + (it?"#FFEB9C":"#FFFF99") + ";color:" + (it?"#9C5700":"#595959") + ";font-weight:700;text-align:center;padding:3px 8px;border:1px solid #bbb;font-size:11px;'>" + lbl + (it?" *":"") + "</td>";
  });
  h += "</tr></thead><tbody>";
  ord.forEach(function(sec) {
    h += "<tr><td colspan='" + (s.days.length+1) + "' style='background:#D6DCE4;font-weight:700;padding:4px 8px;border:1px solid #bbb;border-top:2px solid #8496B0;color:#1F3864;text-transform:uppercase;letter-spacing:0.05em;'>" + sec + "</td></tr>";
    secs[sec].forEach(function(emp, ei) {
      var bg = (ei % 2 === 0) ? "#fff" : "#F7FBFF";
      var nm = (currentEmail && USERS[currentEmail] && USERS[currentEmail].toLowerCase() === emp.name.toLowerCase());
      var rowbg = nm ? "#FFFDE7" : bg;
      var namebg = nm ? "#FFF9C4" : (ei%2===0?"#EEF4FB":"#DDE9F5");
      h += "<tr class='re' data-name='" + emp.name.toLowerCase() + "'>";
      h += "<td style='background:" + namebg + ";color:#1F3864;font-weight:600;padding:4px 8px;border:1px solid #ddd;text-align:left;white-space:nowrap;'>" + emp.name + "</td>";
      s.days.forEach(function(d) {
        var v = emp.shifts[d.date] || "OFF", u = v.toLowerCase();
        var it = d.date === today;
        var bg2 = it ? "#FFF3E0" : "";
        var style = "padding:4px 8px;border:1px solid #ddd;text-align:center;";
        if (u === "off") { style += "background:#D9D9D9;color:#000;font-style:italic;"; }
        else if (u === "on-call") { style += "background:#FFEB9C;color:#9C5700;font-weight:600;"; v = "On-Call"; }
        else if (u === "pto") { style += "background:#92D050;color:#375623;font-weight:700;"; }
        else { style += (bg2?"background:"+bg2+";":"background:"+rowbg+";") + "color:#1F3864;font-weight:600;"; }
        h += "<td style='" + style + "'>" + v + "</td>";
      });
      h += "</tr>";
    });
  });
  h += "</tbody></table>";
  document.getElementById("sw").innerHTML = h;
  if (currentEmail && USERS[currentEmail]) document.getElementById("mn").textContent = "* Your schedule is highlighted";
  filter();
}

function filter() {
  var q = (document.getElementById("srch") ? document.getElementById("srch").value : "").toLowerCase().trim();
  document.querySelectorAll(".re").forEach(function(r) {
    r.style.display = (q && !(r.dataset.name||"").includes(q)) ? "none" : "";
  });
}

function toggleAP() {
  var p = document.getElementById("ap");
  if (p) p.style.display = (p.style.display === "none" || !p.style.display) ? "block" : "none";
  renderAP();
}

function renderAP() {
  var eb = document.getElementById("eb");
  var ec = document.getElementById("ec");
  if (!eb) return;
  var pins = JSON.parse(localStorage.getItem("npins") || "{}");
  var keys = Object.keys(USERS).sort();
  if (ec) ec.textContent = keys.length + " employees";
  var h = "";
  keys.forEach(function(e) {
    var pinOk = pins[e] && pins[e] !== "1234";
    h += "<tr style='border-bottom:1px solid #eee;'>" +
      "<td style='padding:5px 10px;font-size:12px;'>" + e + "</td>" +
      "<td style='padding:5px 10px;font-size:12px;'>" + USERS[e] + "</td>" +
      "<td style='padding:5px 10px;font-size:12px;'>" + (pinOk ? "<span style='color:#375623;font-weight:700;'>Set</span>" : "<span style='color:#c00;font-weight:700;'>Default</span>") + "</td>" +
      "<td style='padding:5px 10px;'>" +
      "<button onclick='rstPin("" + e + "")' style='background:#9C5700;color:#fff;border:none;padding:3px 8px;border-radius:3px;cursor:pointer;font-size:0.72rem;margin-right:3px;'>Reset</button>" +
      "<button onclick='rmEmp("" + e + "")' style='background:#7f1d1d;color:#fff;border:none;padding:3px 8px;border-radius:3px;cursor:pointer;font-size:0.72rem;'>Remove</button>" +
      "</td></tr>";
  });
  eb.innerHTML = h;
}

function addEmp() {
  var e = (document.getElementById("ae").value||"").trim().toLowerCase();
  var n = (document.getElementById("an").value||"").trim();
  var err = document.getElementById("aer");
  if (err) err.textContent = "";
  if (!e || !e.includes("@")) { if(err) err.textContent = "Enter a valid email."; return; }
  if (!n) { if(err) err.textContent = "Enter a name."; return; }
  USERS[e] = n;
  document.getElementById("ae").value = "";
  document.getElementById("an").value = "";
  renderAP();
}

function rstPin(e) {
  if (!confirm("Reset PIN for " + e + " to 1234?")) return;
  var pins = JSON.parse(localStorage.getItem("npins") || "{}");
  delete pins[e];
  localStorage.setItem("npins", JSON.stringify(pins));
  renderAP();
}

function rmEmp(e) {
  if (!confirm("Remove " + e + "?")) return;
  delete USERS[e];
  renderAP();
}

function upSched(evt) {
  var f = evt.target.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function(e) {
    try {
      var wb = XLSX.read(e.target.result, {type:"binary", cellDates:true});
      var ws = wb.Sheets[wb.SheetNames[0]];
      var SKW = ["deliveries","coordinator","production","icqa","label room","inbound","outbound","training"];
      var result = [];
      [{nc:0,ds:1},{nc:9,ds:10}].forEach(function(cfg) {
        var days=[], emps=[], sec="", maxR=0, seen={};
        Object.keys(ws).forEach(function(k){ if(k[0]!=="!"){var ref=XLSX.utils.decode_cell(k);if(ref.r>maxR)maxR=ref.r;} });
        for(var c=cfg.ds;c<cfg.ds+7;c++){
          var dc=XLSX.utils.encode_cell({r:0,c:c}), dtc=XLSX.utils.encode_cell({r:1,c:c});
          var dn=ws[dc]?String(ws[dc].v||"").trim():["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][c-cfg.ds];
          var dv=ws[dtc]?ws[dtc].v:null, ds="";
          if(dv instanceof Date)ds=dv.toISOString().split("T")[0];
          else if(typeof dv==="number"){var dd=new Date(Math.round((dv-25569)*86400*1000));ds=dd.toISOString().split("T")[0];}
          days.push({day:dn,date:ds});
        }
        for(var row=2;row<=maxR;row++){
          var nc=XLSX.utils.encode_cell({r:row,c:cfg.nc});if(!ws[nc])continue;
          var nm=String(ws[nc].v||"").trim();if(!nm)continue;
          var svs=[];
          for(var ci=cfg.ds;ci<cfg.ds+7;ci++){var sc=XLSX.utils.encode_cell({r:row,c:ci});svs.push(ws[sc]?String(ws[sc].v||"").trim():"");}
          var ne=svs.filter(function(v){return v&&v!=="`"&&v!=="'";});
          if(SKW.some(function(k){return nm.toLowerCase().indexOf(k)!==-1;})||ne.length===0){sec=nm;continue;}
          if(seen[nm.toLowerCase()])continue;seen[nm.toLowerCase()]=true;
          var sh={};days.forEach(function(d,di){var v=svs[di];sh[d.date]=v&&v!=="`"&&v!=="'"?v:"OFF";});
          emps.push({name:nm,section:sec,shifts:sh});
        }
        if(days[1]&&days[1].date)result.push({week_start:days[1].date,days:days,employees:emps});
      });
      if(!result.length)throw new Error("No schedules found");
      currentScheds=result;
      localStorage.setItem("neato_scheds",JSON.stringify(result));
      buildTabs();
      alert("Schedule updated successfully!");
    } catch(err) { alert("Error reading file: "+err.message); }
  };
  r.readAsBinaryString(f);
}

document.getElementById("pn").onkeydown = function(e) {
  if (e.key === "Enter") tryLogin();
};
document.getElementById("em").onkeydown = function(e) {
  if (e.key === "Enter") document.getElementById("pn").focus();
