<style>

body{font-family:Arial,sans-serif;background:#1F3864;display:flex;align-items:center;justify-content:center;min-height:100vh;}
.card{background:#fff;border-radius:10px;padding:40px;width:340px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.3);}
h2{color:#1F3864;margin-bottom:4px;}
p{color:#888;font-size:0.82rem;margin-bottom:20px;}

button{width:100%;margin-top:16px;padding:12px;background:#1F3864;color:#fff;border:none;border-radius:5px;font-size:1rem;font-weight:700;cursor:pointer;}
button:hover{background:#2E75B6;}
#msg{color:#c00;font-size:0.82rem;margin-top:8px;min-height:18px;}
.hint{font-size:0.72rem;color:#aaa;margin-top:8px;}
</style>

function tryLogin(){
  var em=document.getElementById("em").value.trim().toLowerCase();
  var pn=document.getElementById("pn").value.trim();
  var msg=document.getElementById("msg");
  msg.textContent="";
  if(!em){msg.textContent="Please enter your email.";return;}
  if(!pn||pn.length<4){msg.textContent="Please enter your 4-digit PIN.";return;}
  if(ADMINS[em]!==undefined){
    if(ADMINS[em]!==pn){msg.textContent="Incorrect PIN.";return;}
    curEmail=em;curAdmin=true;showApp("Admin",true);return;
  }
  if(USERS[em]===undefined){msg.textContent="Email not found. Contact your manager.";return;}
  var stored=getPin(em);
  if(pn==="1234"&&!stored){curEmail=em;curAdmin=false;doChangePin("first");return;}
  if((stored||"1234")!==pn){msg.textContent="Incorrect PIN. First time? Use: 1234";return;}
  curEmail=em;curAdmin=false;showApp(USERS[em].name,false);
}

function doChangePin(mode){
  var np=prompt(mode==="first"?"Welcome! Set a new 4-digit PIN (not 1234):":"Enter new 4-digit PIN (not 1234):");
  if(!np||np.length!==4||!/^[0-9]{4}$/.test(np)||np==="1234"){alert("Invalid PIN. Must be 4 digits, not 1234.");return;}
  var cp=prompt("Confirm your new PIN:");
  if(np!==cp){alert("PINs did not match. Try again.");return;}
  setPin(curEmail,np);
  showApp(USERS[curEmail]?USERS[curEmail].name:"Admin",curAdmin);
}

function buildTabs(){
  var today=new Date().toISOString().split("T")[0],auto=0,html="";
  curScheds.forEach(function(s,i){
    var ws=new Date(s.week_start+"T12:00:00"),we=new Date(ws);we.setDate(we.getDate()+6);
    var weStr=we.toISOString().split("T")[0];
    var lbl=(ws.getMonth()+1)+"/"+ws.getDate()+" - "+(we.getMonth()+1)+"/"+we.getDate()+"/"+String(we.getFullYear()).slice(2);
    var b="";
    if(today>=s.week_start&&today<=weStr){b="<span style='background:#375623;color:#fff;font-size:0.6rem;padding:1px 5px;border-radius:3px;margin-left:4px;'>CURRENT</span>";auto=i;}
    else if(i>0&&today>curScheds[i-1].week_start){b="<span style='background:#9C5700;color:#fff;font-size:0.6rem;padding:1px 5px;border-radius:3px;margin-left:4px;'>NEXT</span>";}
    html+="<button onclick='render("+i+")' id='tb"+i+"' style='background:#dce6f1;color:#1F3864;border:none;cursor:pointer;padding:7px 18px;font-size:0.82rem;font-weight:700;border-radius:4px 4px 0 0;font-family:inherit;'>"+lbl+b+"</button>";
  });
  document.getElementById("tabs").innerHTML=html;
  render(auto);
}

  h+="</tr></thead><tbody>";

    h+="<tr><td colspan='"+(s.days.length+1)+"' style='background:#D6DCE4;font-weight:700;padding:4px 8px;border:1px solid #bbb;border-top:2px solid #8496B0;color:#1F3864;text-transform:uppercase;letter-spacing:0.05em;'>"+sec+"</td></tr>";

        else{st+=(it?"background:#FFF3E0;":"background:"+(mine?"#FFFDE7":bg)+";")+"color:#1F3864;font-weight:600;";}

function addEmp(){

function upSched(evt){
  var f=evt.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:"binary",cellDates:true}),ws=wb.Sheets[wb.SheetNames[0]];
      var SKW=["deliveries","coordinator","production","icqa","label room","inbound","outbound","training"],result=[];
      [{nc:0,ds:1},{nc:9,ds:10}].forEach(function(cfg){
        var days=[],emps=[],sec="",maxR=0,seen={};
        Object.keys(ws).forEach(function(k){if(k[0]!=="!"){var ref=XLSX.utils.decode_cell(k);if(ref.r>maxR)maxR=ref.r;}});
        for(var c=cfg.ds;c<cfg.ds+7;c++){
          var dc=XLSX.utils.encode_cell({r:0,c:c}),dtc=XLSX.utils.encode_cell({r:1,c:c});
          var dn=ws[dc]?String(ws[dc].v||"").trim():["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][c-cfg.ds];
          var dv=ws[dtc]?ws[dtc].v:null,ds="";
          if(dv instanceof Date)ds=dv.toISOString().split("T")[0];
          else if(typeof dv==="number"){var dd=new Date(Math.round((dv-25569)*86400*1000));ds=dd.toISOString().split("T")[0];}
          days.push({day:dn,date:ds});
        }
        for(var row=2;row<=maxR;row++){
          var nc=XLSX.utils.encode_cell({r:row,c:cfg.nc});if(!ws[nc])continue;
          var nm=String(ws[nc].v||"").trim();if(!nm)continue;
          var svs=[];
          for(var ci=cfg.ds;ci<cfg.ds+7;ci++){var sc=XLSX.utils.encode_cell({r:row,c:ci});svs.push(ws[sc]?String(ws[sc].v||"").trim():"");}
          var ne=svs.filter(function(v){return v&&v!=="`"&&v!=="'";});
          if(SKW.some(function(k){return nm.toLowerCase().indexOf(k)!==-1;})||ne.length===0){sec=nm;continue;}
          if(seen[nm.toLowerCase()])continue;seen[nm.toLowerCase()]=true;
          var sh={};days.forEach(function(d,di){var v=svs[di];sh[d.date]=v&&v!=="`"&&v!=="'"?v:"OFF";});
          emps.push({name:nm,section:sec,shifts:sh});
        }
        if(days[1]&&days[1].date)result.push({week_start:days[1].date,days:days,employees:emps});
      });
      if(!result.length)throw new Error("No schedules found");
      curScheds=result;localStorage.setItem("neato_scheds",JSON.stringify(result));buildTabs();alert("Schedule updated!");
    }catch(err){alert("Error: "+err.message);}
  };
  r.readAsBinaryString(f);
}
</script>
