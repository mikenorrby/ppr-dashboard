<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neato Warehouse Schedule</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Calibri, Arial, sans-serif; background: #f0f0f0; font-size: 13px; }

/* Login */
#loginScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; background:#1F3864; }
.login-card { background:#fff; border-radius:10px; padding:36px 40px; width:100%; max-width:360px; text-align:center; box-shadow:0 8px 32px rgba(0,0,0,0.3); }
.login-logo { font-size:2.5rem; margin-bottom:8px; }
.login-title { font-size:1.2rem; font-weight:700; color:#1F3864; margin-bottom:4px; }
.login-sub { font-size:0.8rem; color:#888; margin-bottom:24px; }
.lbl { font-size:0.78rem; font-weight:700; color:#595959; text-align:left; margin-bottom:4px; display:block; margin-top:12px; }
.inp { width:100%; padding:10px 12px; border:1px solid #ccc; border-radius:5px; font-size:0.9rem; font-family:inherit; outline:none; }
.inp:focus { border-color:#2E75B6; }
.btn { width:100%; background:#1F3864; color:#fff; border:none; padding:12px; border-radius:5px; font-size:0.95rem; font-weight:700; cursor:pointer; font-family:inherit; margin-top:18px; }
.btn:hover { background:#2E75B6; }
.err { color:#c00; font-size:0.82rem; margin-top:10px; min-height:18px; }
.hint { margin-top:10px; font-size:0.72rem; color:#aaa; }

/* Change PIN */
#changePinScreen { display:none; align-items:center; justify-content:center; min-height:100vh; background:#1F3864; }

/* App */
#appScreen { display:none; }
.app-header { background:#1F3864; color:#fff; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; }
.app-header h1 { font-size:1.1rem; font-weight:700; }
.app-sub { font-size:0.75rem; color:#BDD7EE; }
.hdr-btns { display:flex; align-items:center; gap:8px; }
.hdr-btn { background:rgba(255,255,255,0.15); color:#fff; border:none; padding:5px 12px; border-radius:4px; cursor:pointer; font-size:0.78rem; font-family:inherit; }
.hdr-btn:hover { background:rgba(255,255,255,0.25); }

.tab-bar { background:#2E75B6; display:flex; gap:4px; padding:8px 16px 0; }
.tab-btn { background:#dce6f1; color:#1F3864; border:none; cursor:pointer; padding:7px 18px; font-size:0.82rem; font-weight:700; border-radius:4px 4px 0 0; font-family:inherit; }
.tab-btn.active { background:#fff; }
.badge { display:inline-block; background:#375623; color:#fff; font-size:0.6rem; padding:1px 5px; border-radius:3px; margin-left:4px; }

.toolbar { background:#fff; border-bottom:2px solid #2E75B6; padding:8px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.search-box { padding:5px 10px; border:1px solid #bbb; border-radius:3px; font-size:0.82rem; font-family:inherit; width:220px; outline:none; }
.search-box:focus { border-color:#2E75B6; }
.upload-lbl { background:#1F3864; color:#fff; padding:5px 14px; border-radius:3px; cursor:pointer; font-size:0.8rem; font-weight:700; font-family:inherit; }
.upload-lbl:hover { background:#2E75B6; }
.upload-lbl.green { background:#375623; }
.upload-lbl.green:hover { background:#4a7a2f; }
#fileInput, #empFileInput { display:none; }

.schedule-wrap { padding:12px 16px 24px; overflow-x:auto; }
.sched-table { border-collapse:collapse; width:100%; min-width:700px; background:#fff; border:1px solid #999; font-size:12px; font-family:inherit; }
.sched-table .row-days th { background:#FFFF99; font-weight:700; text-align:center; padding:5px 8px; border:1px solid #bbb; }
.sched-table .row-days th:first-child { background:#fff; text-align:left; min-width:170px; }
.sched-table .row-days th.tday { background:#FFEB9C; color:#9C5700; }
.sched-table .row-dates td { background:#FFFF99; font-weight:700; text-align:center; padding:3px 8px; border:1px solid #bbb; font-size:11px; color:#595959; }
.sched-table .row-dates td:first-child { background:#fff; }
.sched-table .row-dates td.tday { background:#FFEB9C; color:#9C5700; }
.sched-table .row-section td { background:#D6DCE4; font-weight:700; padding:4px 8px; border:1px solid #bbb; border-top:2px solid #8496B0; color:#1F3864; text-transform:uppercase; letter-spacing:0.05em; }
.sched-table .row-emp td { padding:4px 8px; border:1px solid #ddd; text-align:center; background:#fff; }
.sched-table .row-emp td:first-child { text-align:left; font-weight:600; background:#EEF4FB; color:#1F3864; white-space:nowrap; }
.sched-table .row-emp:nth-child(even) td { background:#F7FBFF; }
.sched-table .row-emp:nth-child(even) td:first-child { background:#DDE9F5; }
.sched-table .row-emp.hidden { display:none; }
.sched-table .row-emp.myrow td { background:#FFFDE7 !important; }
.sched-table .row-emp.myrow td:first-child { background:#FFF9C4 !important; font-size:13px; }
.off { color:#000; font-style:italic; background:#D9D9D9 !important; }
.hours { color:#1F3864; font-weight:600; }
.oncall { color:#9C5700; background:#FFEB9C !important; font-weight:600; }
.pto { color:#375623; background:#92D050 !important; font-weight:700; }
.tday-cell { background:#FFF3E0 !important; }

/* Admin panel */
#adminPanel { display:none; padding:0 16px 24px; }
.admin-card { background:#fff; border-radius:8px; padding:20px; border:1px solid #ddd; }
.admin-title { font-size:1rem; font-weight:700; color:#1F3864; margin-bottom:12px; display:flex; justify-content:space-between; }
.add-row { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:flex-end; }
.add-inp { padding:5px 8px; border:1px solid #ccc; border-radius:3px; font-size:0.82rem; font-family:inherit; }
.add-btn { background:#375623; color:#fff; border:none; padding:6px 14px; border-radius:3px; cursor:pointer; font-size:0.82rem; font-weight:700; font-family:inherit; }
.emp-table { width:100%; border-collapse:collapse; font-size:12px; }
.emp-table th { background:#1F3864; color:#fff; padding:6px 10px; text-align:left; }
.emp-table td { padding:5px 10px; border-bottom:1px solid #eee; }
.act-btn { border:none; padding:3px 8px; border-radius:3px; cursor:pointer; font-size:0.72rem; font-family:inherit; margin-right:3px; color:#fff; }
.act-btn.blue { background:#1F3864; }
.act-btn.red { background:#7f1d1d; }
.act-btn.orange { background:#9C5700; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">🏭</div>
    <div class="login-title">Neato Warehouse</div>
    <div class="login-sub">Employee Schedule Portal</div>
    <label class="lbl">Email Address</label>
    <input class="inp" type="email" id="loginEmail" placeholder="your@email.com">
    <label class="lbl">4-Digit PIN</label>
    <input class="inp" type="password" id="loginPin" placeholder="Enter PIN" maxlength="4" inputmode="numeric">
    <button class="btn" id="loginBtn">View My Schedule</button>
    <div class="err" id="loginErr"></div>
    <div class="hint">First time? Use PIN: <strong>1234</strong></div>
  </div>
</div>

<!-- CHANGE PIN -->
<div id="changePinScreen" style="display:none;align-items:center;justify-content:center;min-height:100vh;background:#1F3864;">
  <div class="login-card">
    <div class="login-logo">🔒</div>
    <div class="login-title">Set Your PIN</div>
    <div class="login-sub" id="cpSub">Choose a personal 4-digit PIN</div>
    <label class="lbl">New PIN</label>
    <input class="inp" type="password" id="newPin" placeholder="New 4-digit PIN" maxlength="4" inputmode="numeric">
    <label class="lbl">Confirm PIN</label>
    <input class="inp" type="password" id="confirmPin" placeholder="Confirm PIN" maxlength="4" inputmode="numeric">
    <button class="btn" id="savePinBtn">Save PIN & Continue</button>
    <div class="err" id="cpErr"></div>
  </div>
</div>

<!-- APP -->
<div id="appScreen">
  <div class="app-header">
    <div>
      <h1>🏭 Neato Warehouse Schedule</h1>
      <div class="app-sub" id="appSub"></div>
    </div>
    <div class="hdr-btns">
      <button class="hdr-btn" id="changePinBtn">Change PIN</button>
      <button class="hdr-btn" id="logoutBtn">Sign Out</button>
    </div>
  </div>
  <div class="toolbar" id="adminToolbar" style="display:none;">
    <label class="upload-lbl">
      📂 Upload Schedule
      <input type="file" id="fileInput" accept=".xlsx">
    </label>
    <label class="upload-lbl green">
      👥 Upload Employee List
      <input type="file" id="empFileInput" accept=".csv,.xlsx">
    </label>
    <button class="upload-lbl" style="background:#8496B0;" id="manageBtn" onclick="toggleAdminPanel()">⚙ Manage Employees</button>
    <span id="uploadStatus" style="font-size:0.75rem;color:#375623;"></span>
  </div>
  <div class="tab-bar" id="tabBar"></div>
  <div class="toolbar">
    <input class="search-box" id="searchInput" placeholder="🔍 Search employee name...">
    <span id="myNote" style="font-size:0.78rem;color:#375623;font-weight:700;"></span>
  </div>
  <div class="schedule-wrap" id="schedWrap"></div>
  <div id="adminPanel" style="display:none;">
    <div class="admin-card">
      <div class="admin-title">
        <span>⚙ Employee Accounts</span>
        <span id="empCount" style="font-size:0.78rem;color:#888;font-weight:400;"></span>
      </div>
      <div class="add-row">
        <div><div style="font-size:0.72rem;font-weight:700;margin-bottom:3px;">Email</div>
          <input class="add-inp" type="email" id="addEmail" placeholder="employee@email.com" style="width:220px;"></div>
        <div><div style="font-size:0.72rem;font-weight:700;margin-bottom:3px;">Name</div>
          <input class="add-inp" type="text" id="addName" placeholder="Last, First" style="width:180px;"></div>
        <button class="add-btn" id="addEmpBtn">+ Add Employee</button>
        <span id="addErr" style="font-size:0.75rem;color:#c00;"></span>
      </div>
      <table class="emp-table">
        <thead><tr><th>Email</th><th>Name</th><th>PIN Status</th><th>Actions</th></tr></thead>
        <tbody id="empBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

// Storage
function getUsers() {
  try {
    var stored = JSON.parse(localStorage.getItem('neato_users') || '{}');
    // Merge defaults with any locally stored users (stored takes priority)
    var merged = Object.assign({}, DEFAULT_USERS, stored);
    return merged;
  } catch(e) { return DEFAULT_USERS; }
}
function saveUsers(u) { localStorage.setItem('neato_users', JSON.stringify(u)); }

// ── Login ──────────────────────────────────────
function doLogin() {
  var email = document.getElementById('loginEmail').value.trim().toLowerCase();
  var pin   = document.getElementById('loginPin').value.trim();
  var err   = document.getElementById('loginErr');
  err.textContent = '';

  if (!email) { err.textContent = 'Enter your email address.'; return; }
  if (!pin || pin.length !== 4) { err.textContent = 'Enter your 4-digit PIN.'; return; }

  // Admin accounts
  var admins = {
    'mike.norrby@neato.com':    { name: 'Mike Norrby',     pin: '0000' },
    'alison.ratering@neato.com': { name: 'Alison Ratering', pin: '0000' },
    'shane.odell@neato.com':     { name: "Shane O'Dell",   pin: '0000' }
  };
  if (admins[email] && admins[email].pin === pin) {
    currentUser = { email: email, name: admins[email].name, isAdmin: true };
    enterApp(); return;
  }

  var users = getUsers();
  if (!users[email]) { err.textContent = 'Email not found. Contact your manager.'; return; }

  var u = users[email];
  if (pin === '1234' && u.pin === '1234') {
    currentUser = { email: email, name: u.name, isAdmin: false };
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('changePinScreen').style.display = 'flex';
    document.getElementById('cpSub').textContent = 'Welcome! Please set a personal PIN.';
    return;
  }
  if (u.pin !== pin) { err.textContent = 'Incorrect PIN. First time? Use PIN: 1234'; return; }

  currentUser = { email: email, name: u.name, isAdmin: false };
  enterApp();
}

// ── Save PIN ───────────────────────────────────
function saveNewPin() {
  var np  = document.getElementById('newPin').value.trim();
  var cp  = document.getElementById('confirmPin').value.trim();
  var err = document.getElementById('cpErr');
  err.textContent = '';
  if (!np || np.length !== 4 || !/^[0-9]{4}$/.test(np)) { err.textContent = 'PIN must be 4 numbers.'; return; }
  if (np !== cp) { err.textContent = 'PINs do not match.'; return; }
  if (np === '1234') { err.textContent = 'Choose a different PIN.'; return; }
  var users = getUsers();
  if (users[currentUser.email]) { users[currentUser.email].pin = np; saveUsers(users); }
  document.getElementById('changePinScreen').style.display = 'none';
  enterApp();
}

// ── Enter app ──────────────────────────────────
function enterApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('changePinScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  document.getElementById('appSub').textContent = 'Welcome, ' + currentUser.name;
  if (currentUser.isAdmin) document.getElementById('adminToolbar').style.display = 'flex';
  buildTabs();
}

// ── Logout ─────────────────────────────────────
function doLogout() {
  currentUser = null;
  document.getElementById('appScreen').style.display = 'none';
  document.getElementById('adminToolbar').style.display = 'none';
  document.getElementById('adminPanel').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPin').value = '';
  document.getElementById('loginErr').textContent = '';
}

// ── Build tabs ─────────────────────────────────
function buildTabs() {
  var today = new Date().toISOString().split('T')[0];
  var auto  = 0;
  var html  = '';
  schedules.forEach(function(s, i) {
    var ws = new Date(s.week_start + 'T12:00:00');
    var we = new Date(ws); we.setDate(we.getDate() + 6);
    var lbl = (ws.getMonth()+1)+'/'+ws.getDate()+' – '+(we.getMonth()+1)+'/'+we.getDate()+'/'+String(we.getFullYear()).slice(2);
    var badge = '';
    var weStr = we.toISOString().split('T')[0];
    if (today >= s.week_start && today <= weStr) { badge = '<span class="badge">CURRENT</span>'; auto = i; }
    else if (i > 0 && today > schedules[i-1].week_start) { badge = '<span class="badge" style="background:#9C5700">NEXT</span>'; }
    html += '<button class="tab-btn" data-idx="'+i+'">'+lbl+badge+'</button>';
  });
  var tabBar = document.getElementById('tabBar');
  tabBar.innerHTML = html;
  tabBar.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() { renderSchedule(parseInt(this.dataset.idx)); });
  });
  renderSchedule(auto);
}

// ── Render schedule ────────────────────────────
function renderSchedule(idx) {
  activeIdx = idx;
  var sched = schedules[idx];
  if (!sched) return;
  document.querySelectorAll('.tab-btn').forEach(function(t) { t.classList.toggle('active', parseInt(t.dataset.idx) === idx); });

  var today = new Date().toISOString().split('T')[0];
  var sections = {}, order = [];
  sched.employees.forEach(function(e) {
    var s = e.section || 'General';
    if (!sections[s]) { sections[s] = []; order.push(s); }
    sections[s].push(e);
  });

  var html = '<table class="sched-table"><thead>';
  html += '<tr class="row-days"><th>Employee</th>';
  sched.days.forEach(function(d) { html += '<th class="'+(d.date===today?'tday':'')+'">'+d.day+'</th>'; });
  html += '</tr><tr class="row-dates"><td></td>';
  sched.days.forEach(function(d) {
    var lbl = d.date ? (function(){ var dt=new Date(d.date+'T12:00:00'); return (dt.getMonth()+1)+'/'+dt.getDate(); })() : '';
    html += '<td class="'+(d.date===today?'tday':'')+'">'+lbl+(d.date===today?' ★':'')+'</td>';
  });
  html += '</tr></thead><tbody>';

  order.forEach(function(sec) {
    html += '<tr class="row-section"><td colspan="'+(sched.days.length+1)+'">'+sec+'</td></tr>';
    sections[sec].forEach(function(emp) {
      html += '<tr class="row-emp" data-name="'+emp.name.toLowerCase()+'">';
      html += '<td>'+emp.name+'</td>';
      sched.days.forEach(function(d) {
        var v = emp.shifts[d.date] || 'OFF';
        var u = v.toLowerCase();
        var cls = d.date === today ? 'tday-cell ' : '';
        if (u === 'off') cls += 'off';
        else if (u === 'on-call') cls += 'oncall';
        else if (u === 'pto') cls += 'pto';
        else cls += 'hours';
        html += '<td class="'+cls.trim()+'">'+(u==='on-call'?'On-Call':v)+'</td>';
      });
      html += '</tr>';
    });
  });
  html += '</tbody></table>';
  document.getElementById('schedWrap').innerHTML = html;
  filterTable();
  highlightMyRow();
}

// ── Highlight my row ───────────────────────────
function highlightMyRow() {
  if (!currentUser) return;
  var users = getUsers();
  var u = users[currentUser.email];
  if (!u) return;
  var n = u.name.toLowerCase();
  document.querySelectorAll('.row-emp').forEach(function(r) {
    var rn = r.dataset.name || '';
    r.classList.toggle('myrow', rn === n || rn.includes(n.split(',')[0].trim()) || n.includes(rn.split(',')[0].trim()));
  });
  var note = document.getElementById('myNote');
  if (note) note.textContent = '★ Your schedule is highlighted';
}

// ── Filter ─────────────────────────────────────
function filterTable() {
  var q = document.getElementById('searchInput').value.toLowerCase().trim();
  document.querySelectorAll('.row-emp').forEach(function(r) {
    r.classList.toggle('hidden', !!q && !(r.dataset.name||'').includes(q));
  });
}

// ── Admin: render panel ────────────────────────
function renderAdminPanel() {
  var users = getUsers();
  var keys  = Object.keys(users);
  document.getElementById('empCount').textContent = keys.length + ' employee' + (keys.length!==1?'s':'');
  var html = '';
  keys.sort().forEach(function(email) {
    var u = users[email];
    var pinSt = u.pin==='1234'
      ? '<span style="color:#c00;font-weight:700;">Default</span>'
      : '<span style="color:#375623;font-weight:700;">Set ✓</span>';
    html += '<tr>' +
      '<td>'+email+'</td><td>'+u.name+'</td><td>'+pinSt+'</td>' +
      '<td>' +
        '<button class="act-btn blue" data-action="edit" data-email="'+email+'">Edit</button>' +
        '<button class="act-btn orange" data-action="reset" data-email="'+email+'">Reset PIN</button>' +
        '<button class="act-btn red" data-action="remove" data-email="'+email+'">Remove</button>' +
      '</td></tr>';
  });
  var tbody = document.getElementById('empBody');
  tbody.innerHTML = html || '<tr><td colspan="4" style="text-align:center;color:#888;padding:12px;">No employees yet.</td></tr>';
  tbody.querySelectorAll('.act-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var action = this.dataset.action;
      var email  = this.dataset.email;
      var users2 = getUsers();
      if (action === 'remove') {
        if (!confirm('Remove access for '+email+'?')) return;
        delete users2[email]; saveUsers(users2);
      } else if (action === 'reset') {
        if (!confirm('Reset PIN for '+email+' to 1234?')) return;
        users2[email].pin = '1234'; saveUsers(users2);
      } else if (action === 'edit') {
        var newName = prompt('Edit name for '+email+':', users2[email].name);
        if (!newName || !newName.trim()) return;
        users2[email].name = newName.trim(); saveUsers(users2);
      }
      renderAdminPanel();
    });
  });
}

// ── Add employee ───────────────────────────────
function addEmployee() {
  var email = document.getElementById('addEmail').value.trim().toLowerCase();
  var name  = document.getElementById('addName').value.trim();
  var err   = document.getElementById('addErr');
  err.textContent = '';
  if (!email || !email.includes('@')) { err.textContent = 'Enter a valid email.'; return; }
  if (!name) { err.textContent = 'Enter a name.'; return; }
  var users = getUsers();
  if (users[email]) { err.textContent = 'Email already exists.'; return; }
  users[email] = { name: name, pin: '1234' };
  saveUsers(users);
  document.getElementById('addEmail').value = '';
  document.getElementById('addName').value = '';
  document.getElementById('uploadStatus').textContent = '✓ Added '+name+' — default PIN: 1234';
  renderAdminPanel();
}

// ── Upload employee list ───────────────────────
function handleEmpUpload(evt) {
  var file = evt.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var users = getUsers();
      var added = 0;
      if (file.name.endsWith('.csv')) {
        e.target.result.split('\n').forEach(function(line) {
          var p = line.split(',');
          var em = (p[0]||'').trim().toLowerCase();
          var nm = (p[1]||'').trim();
          if (em && em.includes('@') && !users[em]) { users[em]={name:nm,pin:'1234'}; added++; }
        });
      } else {
        var wb = XLSX.read(e.target.result, {type:'binary'});
        XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1}).forEach(function(row) {
          var em = String(row[0]||'').trim().toLowerCase();
          var nm = String(row[1]||'').trim();
          if (em && em.includes('@') && !users[em]) { users[em]={name:nm,pin:'1234'}; added++; }
        });
      }
      saveUsers(users);
      document.getElementById('uploadStatus').textContent = '✓ '+added+' employees added';
      renderAdminPanel();
    } catch(err) { document.getElementById('uploadStatus').textContent = '✗ '+err.message; }
  };
  if (file.name.endsWith('.csv')) reader.readAsText(file);
  else reader.readAsBinaryString(file);
}

// ── Upload schedule ────────────────────────────
function handleScheduleUpload(evt) {
  var file = evt.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var wb = XLSX.read(e.target.result, {type:'binary',cellDates:true});
      var ws = wb.Sheets[wb.SheetNames[0]];
      var SKW = ['deliveries','coordinator','production','icqa','label room','inbound','outbound','training'];
      var cfgs = [{nc:0,ds:1},{nc:9,ds:10}];
      var result = [];
      cfgs.forEach(function(cfg) {
        var days=[], emps=[], sec='', maxR=0;
        Object.keys(ws).forEach(function(k){ if(k[0]!=='!'){var r=XLSX.utils.decode_cell(k);if(r.r>maxR)maxR=r.r;} });
        for (var c=cfg.ds;c<cfg.ds+7;c++) {
          var dc=XLSX.utils.encode_cell({r:0,c:c}), dtc=XLSX.utils.encode_cell({r:1,c:c});
          var dn=ws[dc]?String(ws[dc].v||'').trim():['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][c-cfg.ds];
          var dv=ws[dtc]?ws[dtc].v:null, ds2='';
          if (dv instanceof Date) ds2=dv.toISOString().split('T')[0];
          else if (typeof dv==='number'){var dd=new Date(Math.round((dv-25569)*86400*1000));ds2=dd.toISOString().split('T')[0];}
          days.push({day:dn,date:ds2});
        }
        var seenNames={};
        for (var r=2;r<=maxR;r++) {
          var nc2=XLSX.utils.encode_cell({r:r,c:cfg.nc});
          if (!ws[nc2]) continue;
          var nm=String(ws[nc2].v||'').trim();
          if (!nm) continue;
          var svs=[];
          for (var ci=cfg.ds;ci<cfg.ds+7;ci++){var sc2=XLSX.utils.encode_cell({r:r,c:ci});svs.push(ws[sc2]?String(ws[sc2].v||'').trim():'');}
          var ne=svs.filter(function(v){return v&&v!=='`'&&v!=="'";});
          if (SKW.some(function(k){return nm.toLowerCase().indexOf(k)!==-1;})||ne.length===0){sec=nm;continue;}
          if (seenNames[nm.toLowerCase()]) continue;
          seenNames[nm.toLowerCase()]=true;
          var shifts={};
          days.forEach(function(d,di){var v=svs[di];shifts[d.date]=v&&v!=='`'&&v!=="'"?v:'OFF';});
          emps.push({name:nm,section:sec,shifts:shifts});
        }
        if (days[1]&&days[1].date) result.push({week_start:days[1].date,days:days,employees:emps});
      });
      if (!result.length) throw new Error('No schedules found');
      schedules = result;
      localStorage.setItem('neato_schedules', JSON.stringify(schedules));
      buildTabs();
      document.getElementById('uploadStatus').textContent = '✓ Schedule updated ('+file.name+')';
    } catch(err2) { document.getElementById('uploadStatus').textContent = '✗ '+err2.message; }
  };
  reader.readAsBinaryString(file);
}
</script>
